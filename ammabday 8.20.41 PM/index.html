<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asme — Built for the curious</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Great+Vibes&display=swap');

  html, body, #root {
    height: 100%;
    margin: 0;
    background: #000;
  }

  /* Subtle ambient backdrop in lieu of the video — replace the .video-placeholder element with a <video> later. */
  .video-placeholder {
    background:
      radial-gradient(60% 50% at 30% 70%, rgba(120, 90, 60, 0.55) 0%, rgba(40, 25, 15, 0.0) 60%),
      radial-gradient(50% 45% at 75% 80%, rgba(80, 60, 110, 0.45) 0%, rgba(20, 15, 30, 0.0) 65%),
      radial-gradient(80% 70% at 50% 110%, rgba(180, 130, 80, 0.35) 0%, rgba(0, 0, 0, 0.0) 70%),
      linear-gradient(180deg, #0a0a0c 0%, #15110d 55%, #271c12 100%);
  }

  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }

  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.15) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.15) 80%,
      rgba(255, 255, 255, 0.45) 100%
    );
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* Inputs */
  input.bare {
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
  }
  input.bare::placeholder { color: rgba(255, 255, 255, 0.4); }

  .hero-root {
    --vignette: 0.55;
    --scale-min: 0.92;
    --scale-max: 1.12;
    --amma-color: #a6cdfb;
    --amma-shadow: rgba(40, 80, 140, 0.3);
    --stair-step: 2.2em;
    --amma-size: 2.4em;
    --amma-tilt: -4deg;
    --title-glow: 0.45;
  }

  /* Hero typography */
  .hero-stage {
    transform-origin: center center;
    will-change: transform;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    color: #fff;
    letter-spacing: 0.005em;
    line-height: 0.95;
    text-align: left;
    margin-top: 1.8em;
    text-shadow:
      0 1px 0 rgba(255, 255, 255, 0.15),
      0 8px 30px rgba(0, 0, 0, var(--title-glow));
  }

  .hero-title .stair {
    display: block;
    white-space: nowrap;
  }
  .hero-title .stair-1 { padding-left: 0;                    }
  .hero-title .stair-2 { padding-left: var(--stair-step);    }
  .hero-title .stair-3 { padding-left: calc(var(--stair-step) * 2); }

  .hero-title .amma {
    font-family: 'Great Vibes', cursive;
    font-style: normal;
    font-weight: 400;
    font-size: var(--amma-size);
    line-height: 0.9;
    display: block;
    padding-left: 0;
    margin-top: calc(-0.7em + 14px);
    transform: translateX(calc(-0.1em + 18px)) rotate(var(--amma-tilt));
    transform-origin: left center;
    color: var(--amma-color);
    -webkit-text-fill-color: var(--amma-color);
    -webkit-text-stroke: 1px var(--amma-color);
    text-shadow:
      0 0 10px var(--amma-color),
      0 0 22px var(--amma-color),
      0 2px 0 var(--amma-shadow),
      0 10px 30px rgba(0, 0, 0, 0.55);
  }

  .hero-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.92);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
  }

  .hero-divider {
    width: 1px;
    height: 18px;
    margin: 0 auto;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "mood": "cinematic",
    "ammaColor": "#a6cdfb",
    "drama": 50
  }/*EDITMODE-END*/;

  // Three palette directions tied to a single "mood" knob.
  const MOODS = {
    tender:    { vignette: 0.55, scaleMin: 0.92, scaleMax: 1.12, glow: 0.45, sat: 1.0,  bgTint: "rgba(0,0,0,0)" },
    cinematic: { vignette: 0.78, scaleMin: 0.82, scaleMax: 1.22, glow: 0.7,  sat: 0.85, bgTint: "rgba(20,10,30,0.25)" },
    playful:   { vignette: 0.32, scaleMin: 0.96, scaleMax: 1.18, glow: 0.25, sat: 1.18, bgTint: "rgba(255,210,200,0.08)" },
  };

  const AMMA_SHADOWS = {
    "#a6cdfb": "rgba(40,80,140,0.3)",
    "#ff8a9c": "rgba(180,60,90,0.3)",
    "#f4b88a": "rgba(120,60,30,0.3)",
    "#c9a8f0": "rgba(80,50,140,0.3)",
    "#a8e6cf": "rgba(40,110,90,0.3)",
  };

  // Tiny inline icon helpers — the spec calls for lucide-react.
  // We mount lucide icons via the lucide UMD after first render.
  const Icon = ({ name, size = 20, className = "", strokeWidth = 1.75, ...rest }) => (
    <i
      data-lucide={name}
      style={{ width: size, height: size, display: "inline-flex" }}
      className={className}
      data-stroke-width={strokeWidth}
      {...rest}
    />
  );

  function Hero({ tweaks }) {
    const videoRef = React.useRef(null);
    const stageRef = React.useRef(null);
    const fadingOutRef = React.useRef(false);
    const fadeRafRef = React.useRef(null);
    const scaleRafRef = React.useRef(null);
    const scaleStateRef = React.useRef({ current: 0.92, target: 0.92 });
    const scaleRangeRef = React.useRef({ min: 0.92, max: 1.12 });

    React.useEffect(() => {
      const video = videoRef.current;
      const stage = stageRef.current;
      if (!video) return;

      // Scale ramp tied to video playback: smaller at the start, larger at the end.
      // Range is mood-driven via scaleRangeRef.
      const SMOOTHING = 0.08;

      const computeTarget = () => {
        const { min, max } = scaleRangeRef.current;
        if (!isFinite(video.duration) || video.duration <= 0) return min;
        const p = Math.min(1, Math.max(0, video.currentTime / video.duration));
        const eased = 1 - Math.pow(1 - p, 2);
        return min + (max - min) * eased;
      };

      const scaleTick = () => {
        const s = scaleStateRef.current;
        s.target = computeTarget();
        s.current += (s.target - s.current) * SMOOTHING;
        if (stage) {
          stage.style.transform = `translateZ(0) scale(${s.current.toFixed(5)})`;
        }
        scaleRafRef.current = requestAnimationFrame(scaleTick);
      };

      const FADE_MS = 500;
      const FADE_OUT_BEFORE_END = 0.55;

      const cancelFade = () => {
        if (fadeRafRef.current != null) {
          cancelAnimationFrame(fadeRafRef.current);
          fadeRafRef.current = null;
        }
      };

      const fadeTo = (target) => {
        cancelFade();
        const start = performance.now();
        const from = parseFloat(video.style.opacity || "0");
        const tick = (now) => {
          const t = Math.min(1, (now - start) / FADE_MS);
          video.style.opacity = String(from + (target - from) * t);
          if (t < 1) {
            fadeRafRef.current = requestAnimationFrame(tick);
          } else {
            fadeRafRef.current = null;
          }
        };
        fadeRafRef.current = requestAnimationFrame(tick);
      };

      const handleLoaded = () => {
        video.style.opacity = "0";
        video.play().catch(() => {});
        fadingOutRef.current = false;
        scaleStateRef.current.current = scaleRangeRef.current.min;
        fadeTo(1);
      };

      const handleTimeUpdate = () => {
        // No fade-out at the end — video pauses on its last frame.
      };

      // Plays once. After it ends, hold final frame and stop the scale loop drift.
      const handleEnded = () => {
        scaleStateRef.current.target = scaleRangeRef.current.max;
      };

      video.style.opacity = "0";
      video.addEventListener("loadeddata", handleLoaded);
      video.addEventListener("timeupdate", handleTimeUpdate);
      video.addEventListener("ended", handleEnded);

      // Drive the scale on its own rAF loop so it stays buttery regardless of timeupdate cadence.
      scaleRafRef.current = requestAnimationFrame(scaleTick);

      // If already loaded by the time the effect runs.
      if (video.readyState >= 2) handleLoaded();

      return () => {
        cancelFade();
        if (scaleRafRef.current != null) cancelAnimationFrame(scaleRafRef.current);
        video.removeEventListener("loadeddata", handleLoaded);
        video.removeEventListener("timeupdate", handleTimeUpdate);
        video.removeEventListener("ended", handleEnded);
      };
    }, []);

    React.useEffect(() => {
      // Render lucide icons after React commits the DOM.
      if (window.lucide && window.lucide.createIcons) {
        window.lucide.createIcons({
          attrs: { "stroke-width": 1.75 },
        });
      }
    });

    // Apply mood preset → scale range, vignette darkness, title glow, etc.
    const mood = MOODS[tweaks.mood] || MOODS.tender;
    React.useEffect(() => {
      scaleRangeRef.current = { min: mood.scaleMin, max: mood.scaleMax };
    }, [mood.scaleMin, mood.scaleMax]);

    // Drama (0–100) reshapes the staircase indent + Amma size + tilt as one expressive knob.
    const d = (tweaks.drama ?? 50) / 100;
    const stairStep = (1.0 + d * 3.4).toFixed(2) + "em";  // 1.0em → 4.4em
    const ammaSize = (1.6 + d * 1.6).toFixed(2) + "em";   // 1.6em → 3.2em
    const ammaTilt = (0.3 + d * 1.8).toFixed(1) + "deg";  // 0.3° → 2.1° (mostly flat)

    const ammaShadow = AMMA_SHADOWS[tweaks.ammaColor] || "rgba(0,0,0,0.35)";

    const heroVars = {
      "--vignette": mood.vignette,
      "--scale-min": mood.scaleMin,
      "--scale-max": mood.scaleMax,
      "--amma-color": tweaks.ammaColor,
      "--amma-shadow": ammaShadow,
      "--stair-step": stairStep,
      "--amma-size": ammaSize,
      "--amma-tilt": ammaTilt,
      "--title-glow": mood.glow,
    };

    return (
      <div className="hero-root relative min-h-screen bg-black overflow-hidden" style={heroVars}>
        {/* Background video */}
        <video
          ref={videoRef}
          className="absolute inset-0 w-full h-full object-cover translate-y-[17%]"
          src="assets/background.mp4"
          autoPlay
          muted
          playsInline
          preload="auto"
          loop={false}
          aria-hidden="true"
          style={{ opacity: 0 }}
        />
        {/* Video chroma + warm/cool wash for the chosen mood */}
        <div
          className="absolute inset-0 pointer-events-none"
          style={{
            background: mood.bgTint,
            mixBlendMode: "soft-light",
          }}
          aria-hidden="true"
        />
        {/* Soft vignette over the video so the glass UI stays legible */}
        <div
          className="absolute inset-0 pointer-events-none"
          style={{
            background:
              `radial-gradient(120% 80% at 50% 30%, rgba(0,0,0,0) 40%, rgba(0,0,0,${mood.vignette}) 100%)`,
          }}
          aria-hidden="true"
        />

        <div className="relative z-10 flex flex-col min-h-screen">
          {/* Hero */}
          <main className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[10%]">
            <div
              ref={stageRef}
              className="hero-stage flex flex-col items-center"
              style={{ transform: "scale(0.92)" }}
            >
              <h1 className="hero-title text-5xl md:text-6xl lg:text-7xl">
                <span className="stair stair-1">Happy</span>
                <span className="stair stair-2">Mother's</span>
                <span className="stair stair-3">Day</span>
                <span className="amma">Amma</span>
              </h1>

              <button className="liquid-glass rounded-full px-8 py-3 text-white text-sm tracking-wide font-medium hover:bg-white/5 transition-colors" style={{marginTop: '0.6em'}}>
                Click for gift
              </button>

              <p className="hero-subtitle text-2xl md:text-3xl" style={{textAlign: 'center', marginTop: '0.8em'}}>
                I love you<span className="not-italic">.</span>
              </p>
            </div>
          </main>
        </div>
      </div>
    );
  }

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <React.Fragment>
        <Hero tweaks={t} />
        <TweaksPanel>
          <TweakSection label="Feel" />
          <TweakRadio
            label="Mood"
            value={t.mood}
            options={["tender", "cinematic", "playful"]}
            onChange={(v) => setTweak("mood", v)}
          />
          <TweakColor
            label="Amma"
            value={t.ammaColor}
            options={["#a6cdfb", "#ff8a9c", "#f4b88a", "#c9a8f0", "#a8e6cf"]}
            onChange={(v) => setTweak("ammaColor", v)}
          />
          <TweakSlider
            label="Drama"
            value={t.drama}
            min={0}
            max={100}
            step={1}
            onChange={(v) => setTweak("drama", v)}
          />
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
